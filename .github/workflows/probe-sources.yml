# Проба: чи пускають нас джерела з адрес GitHub.
#
# 🔴 ТІЛЬКИ `workflow_dispatch` — жодного `schedule`.
# Це перший із трьох кроків переїзду, і на ньому проба не має ходити по
# чужих сайтах сама. Погодинний збір — окремий workflow наступного кроку,
# і вмикати його треба свідомо, а не тим, що хтось забув прибрати розклад.
#
# Що означає результат:
#   зелений — цього разу з цієї адреси пустили;
#   червоний — хоч одне ввімкнене джерело не дало даних.
#
# ⚠️ Зелений НЕ означає «доступ стабільний»: блокування буває ймовірнісним
# (work.ua свого часу пропускав 3 запити з 9). Проба друкує це застереження
# у власний лог — не прибирати.

name: Проба джерел (вручну)

on:
  workflow_dispatch:
    inputs:
      full:
        # 🔴 Типово — ПОЛЕГШЕНА. Повна проба обходить усі 41 фід компаній
        # `dou_companies` плюс `recruitee`, бо на раннері немає історії
        # заборів і добові джерела не пропускаються. Повторних проб —
        # якими тільки й видно ймовірнісне блокування — буде багато, а
        # повних треба зрідка. Прапорець у коді без входу тут був би
        # недосяжний: власник запускає пробу лише з цієї вкладки.
        description: "Повна проба: стукає ще й у 41 фід dou_companies"
        type: boolean
        default: false

# Проба нічого не пише: ні в базу, ні в репозиторій. Права лише на читання —
# щоб це гарантувалось не наміром, а налаштуванням.
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # Джерел багато, кожне зі своїми таймаутами; але якщо проба висить
    # пів години — це теж результат, і краще його побачити.
    timeout-minutes: 15

    steps:
      - name: Забрати код
        uses: actions/checkout@v4

      - name: Поставити Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Поставити залежності
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Тести перед пробою
        # Якщо зламаний розбір, проба показала б «джерело дало нуль» і ми
        # пішли б шукати блокування там, де його немає.
        run: python tests/test_parsing.py

      - name: Проба джерел
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python tools/probe_cloud.py
          else
            python tools/probe_cloud.py --skip-daily
          fi

      - name: Перевірити, що репозиторій не змінився
        # ⚠️ Крок доводить рівно це: у робочій теці немає змін, які git
        # бачить. Він НЕ доводить, що проба взагалі нічого не писала:
        # `.gitignore` ховає `out/`, `digest.html`, `*.db` — запис туди цей
        # крок пропустив би. Що база не змінилась, перевірено окремо й
        # вручну: sha256 до й після прогону збігся (21.10.2026).
        # Називаю точно, бо «нічого не записала» і «git нічого не бачить» —
        # сусідні величини, а на них ми в цьому проєкті вже обпікались.
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "🔴 Проба змінила робочу теку:"
            git status --porcelain
            exit 1
          fi
          echo "🟢 Робоча тека чиста — репозиторій проба не змінила."
