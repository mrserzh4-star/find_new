# ─────────────────────────────────────────────────────────────────────────
[companies]
# Групи в боковому меню, розділ «Компанії у стрічці».
#
# ⚠️ ГОЛОВНЕ ПРО НАЗВИ ГРУП: поля галузі в нас немає й нізвідки взяти. Тому
# групи кажуть, ДЕ МИ ЗНАЙШЛИ компанію, а не якої вона галузі. «Поза
# IT-бордами» не означає «не айтишна» — означає «її немає на Djinni й DOU».
# Стверджувати класифікацію, якої ми не робили, не можна: це те саме, що
# написати «сайти компаній» там, де насправді фіди DOU.
#
# Групи ПЕРЕТИНАЮТЬСЯ: EPAM це і Топ-50, і IT-борди. Компанія показується в
# кожній групі, до якої належить.
#
# Банки перелічені явно, а не шукаються регуляркою по слову «bank» чи
# «credit»: грубий пошук зачепив «Creditbooster.ai», який є стартапом, а не
# банком. Додавай сюди нові банки руками.
# Банки — СЛАГАМИ, а не назвами. Слаг однозначний, назва ні: той самий банк
# зветься `ПриватБанк` у фіді DOU й `PrivatBank` у вакансії з Djinni.
banking = [
  "raiffeisen", "pivdenny", "privatbank", "ukrsibbank", "otp-bank-ukraine",
  "mono", "fuib", "novapay", "sensebank", "at-oschadbank", "otp-digital",
  "universal-bank", "kredobank", "a-bank", "idea-bank", "pravex", "cominbank",
  "mtb-bank", "izibank", "bank-lviv", "megabank",
]

# 🔴 Псевдоніми: та сама компанія під різними назвами.
#
# Ліворуч — як її звуть у ФІДІ DOU, праворуч — як у вакансіях з інших бордів.
# Без цього в переліку були б ДВА рядки для одного банку: «ПриватБанк 0»
# (стежимо) і «PrivatBank 1» (прийшла з Djinni).
#
# Заміряно 31.07.2026 по всіх 41 слагу: розбіжностей рівно дві.
#
# ⚠️ Механізм не вміє вгадувати нові написання. Якщо джерело почне звати
# компанію інакше, зʼявиться другий рядок — це буде ВИДНО, а не тихо, і
# лікується додаванням сюди.
aliases = { privatbank = "PrivatBank", luxoft = "Luxoft" }

[directions."Webflow-розробка"]
# 🔴 СВІДОМИЙ ВИНЯТОК: цей напрям шукається в ОПИСІ, а не в заголовку.
# Не «полагодь» це — правило про заголовки лишається чинним для решти.
#
# Причина: `Webflow` у заголовку 0 разів із 270, в описі — 14. Інструменти
# взагалі майже не потрапляють у назву посади: Framer 1/9, WordPress 0/2,
# Tilda 0/0. Але інструмент — не дисципліна: слова «дизайн» чи «бренд» є в
# описі майже кожної вакансії, а `Webflow` там, де він справді потрібен.
#
# `match = "description"` вмикає пошук у тілі, `not_near` — стоп-контекст.
match = "description"

# Стоп-контекст: агенція, що описує СЕБЕ, а не вимогу до кандидата:
#   «Nielsen Norman Group UX certified, and a Webflow Experts partner,
#    holding a 5.0 rating on Clutch»
# Заміряно 28.07.2026: цей перелік вирізає рівно дві такі вакансії
# (обидві Phenomenon Studio), ширші набори не додають жодної.
not_near = ["partner", "certified", "rating"]

# За замовчуванням знято — прохання власника.
default = false
keys = ["webflow"]
