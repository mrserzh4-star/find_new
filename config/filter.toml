# ЯКІ ВАКАНСІЇ ЛОВИМО — правиться тут, у коді нічого міняти не треба.
# Після правки просто запусти сервіс знову: run.bat (або python run.py run)
#
# Формат: рядок = "текст у лапках". Список = кома між рядками у [ ].
# Рядок, що починається з #, сервіс не читає — це нотатка для себе.

[run]
# Де сервіс тримає памʼять про вже показані вакансії.
# НЕ клади цей файл у папку OneDrive: синхронізація може підхопити базу
# посеред запису й побити її. %LOCALAPPDATA% — локальна папка, її не синкає.
db = "%LOCALAPPDATA%/find_new/state.db"

# Куди віддаємо результат:
#   "html"    — сторінка digest.html, яку відкриваєш у браузері (головне)
#   "json"    — той самий зріз машиночитно, якщо схочеш підключити щось своє
#   "console" — друк у вікно запуску, зручно для перевірки руками
sinks  = ["html", "json", "console"]
digest = "digest.html"
dump   = "out/vacancies.json"

# Скільки днів тримати картку на сторінці ВІДТОДІ, ЯК СЕРВІС ЇЇ ВПЕРШЕ ПОБАЧИВ.
# Це НЕ «показувати вакансії за останні 14 днів»: вакансія могла бути
# опублікована задовго до того, як ми її знайшли. Зараз близько чверті
# показаних старші за два тижні, найстаріша — 28 днів.
# Вік кожної видно на картці, а сортування ставить свіжі вгорі, тож старі
# самі опускаються вниз.
window_days = 14

# ── Djinni — головне джерело ──────────────────────────────────────────
# Кращий за DOU: там одна звалка "Design" на всі спеціальності, тут окремі
# категорії, тому інженерних вакансій у видачі немає взагалі.
# Компанія й локація беруться зі сторінки вакансії — але тільки для НОВИХ,
# щоб не робити сотні запитів щогодини.
#
# Додати категорію = дописати блок [[sources.djinni.feeds]] із одним рядком.
# Назви категорій — рівно як на djinni.co: "UI UX", "Product Design",
# "Graphic Design", "UX Research", "Motion Design", "Illustrator".
# НЕ додавай "Electronics / PCB Design", "Engineering / CAD Design" —
# це інженерія, той самий клас сміття, що псує DOU.

[sources.djinni]
enabled = true
# trust_category означає НЕ "у джерела є категорія Design" (така є в усіх),
# а "категорія цього джерела достатньо точна, щоб не перевіряти вміст".
# Djinni відбирає точними категоріями (UI UX, Product Design…), тому шукати
# ключові слова в заголовку тут не треба: покращити це нічого не може, а
# втрачати — може. Саме так тихо зникали "Art Director" і "Creative Lead".
# Стоп-слова нижче діють завжди, незалежно від цього прапорця.
#
# ЗАМІРЯНО 27.07.2026: не за профілем ~3% (5 зі 159).
# Цифра має термін придатності. Перезаміряти, якщо у стрічці почнуть
# з'являтися ролі, яких там бути не має.
trust_category = true

[[sources.djinni.feeds]]
primary_keyword = "UI UX"

[[sources.djinni.feeds]]
primary_keyword = "Product Design"

[[sources.djinni.feeds]]
primary_keyword = "Design"

[[sources.djinni.feeds]]
primary_keyword = "Graphic Design"

[[sources.djinni.feeds]]
primary_keyword = "UX Research"

# ── HappyMonday — інші роботодавці ────────────────────────────────────
# Не IT-борд: креативні агенції, медіа, громадський сектор. Перетин
# роботодавців із DOU — 2 з 19, тобто це доступ до прошарку, якого на
# IT-бордах немає взагалі. Інженерного сміття тут нуль.
#
# Категорія фільтрується НА НАШОМУ боці: сервер такий параметр мовчки
# ігнорує й віддає всю історію. Значення — як у самого сайту в мітках.
[sources.happymonday]
# 🔴 ВИМКНЕНО 30.07.2026 — не тому, що зламалось, а за НАШИМ рішенням.
#
# ⚠️ ЯКЩО ТИ ПРИЙШОВ ПЕРЕВІРИТИ І ПОБАЧИВ, ЩО НАМ НІБИ МОЖНА — читай далі,
# попередник не помилився.
#
# Їхній robots.txt забороняє весь клас AI-краулерів поіменно:
#     User-agent: ClaudeBot          Disallow: /
#     User-agent: GPTBot             Disallow: /
#     User-agent: CCBot              Disallow: /
#     User-agent: Google-Extended    Disallow: /
#     …ще чотири, блок Cloudflare Managed
#     User-agent: *                  Allow: /
# плюс `Content-Signal: ai-train=no` — пряме застереження прав за ст. 4
# Директиви ЄС 2019/790.
#
# Наш UA — `find_new-jobfeed` — під ЖОДЕН із названих рядків не підпадає.
# Заміряно `robotparser`-ом 30.07.2026:
#     ClaudeBot         → False
#     find_new-jobfeed  → True     ← за буквою нам МОЖНА
#
# Вимкнено попри це. Намір власника сайту однозначний: він перелічив
# краулери, керовані ШІ, а наш збирач працює саме під керуванням ШІ. Чи
# вважати `find_new-jobfeed` таким краулером — двозначність, і в нас є
# правило з BetterMe: **двозначність тлумачиться на користь власника
# сайту, а не на нашу.**
#
# Ця підстава сильніша за «нам заборонено буквою»: та перевіряється й
# спростовується за хвилину, а ця не спростовується — бо це наш вибір, а
# не їхній текст.
#
# ⚠️ Причина навмисно НЕ така, як в Andersen. Там «API не відповідає» —
# стан, який може минути сам. Тут рішення, яке саме не мине. Перший стан
# чекають, другий поважають. Якщо хтось прочитає це як «тимчасово впало»
# й увімкне назад — ми підемо туди, куди нас просили не ходити.
#
# Обхідного шляху не шукати. Технічно він теж закритий (вакансії переїхали
# у `/hm-internal/v1/jobs` за авторизацією), але це НЕ причина — причина
# вище.
enabled = false
note = "robots.txt: заборонено весь клас AI-краулерів поіменно (ClaudeBot, GPTBot, CCBot, Google-Extended та ін., Cloudflare Managed). Наш UA find_new-jobfeed під букву заборони не підпадає, але намір однозначний — вимкнено за правилом «двозначність на користь власника сайту». Виявлено 30.07.2026. Це рішення власника сайту, а не збій: воно не мине саме."

# Категорія "дизайн" тут чиста — інженерів у ній нема, джерело відбирає само.
# ЗАМІРЯНО 27.07.2026: не за профілем 0% (0 з 22).
trust_category = true

[[sources.happymonday.feeds]]
categories = "dyzajn"

# ── DOU — другорядне джерело ──────────────────────────────────────────
[sources.dou]
enabled = true
# У DOU одна спільна категорія Design, куди потрапляють і інженери-конструктори.
# Тут ключові слова потрібні: джерело саме не відбирає.
# ЗАМІРЯНО 27.07.2026: не за профілем 14% (14 з 98) — тому false.
trust_category = false

# Кожен блок [[sources.dou.feeds]] — окремий запит до DOU.
# Додати ще один = дописати такий самий блок із трьох рядків.
#
# ВАЖЛИВО: загальний фід (без жодного з полів нижче) використовувати не можна.
# Заміряно: він містить лише останню годину вакансій, тобто при щогодинному
# запуску частина губиться назавжди. Категорійний фід тримає ~4-5 діб.
# Сервіс сам не дасть запуститись, якщо фід не звужений — покаже помилку.
#
# Дозволені поля (інші DOU мовчки ігнорує, тому сервіс на них падає навмисне):
#   category — назва категорії ЛАТИНИЦЕЮ, як на сайті (кирилиця дає помилку)
#   search   — текстовий пошук
#   city     — місто
#   exp      — досвід
#   remote   — віддалена робота

[[sources.dou.feeds]]
category = "Design"

# ── Andersen — вимкнено, і ось чому ──────────────────────────────────
# Кар'єрка однієї компанії. Адаптер написаний і готовий, але:
#   • під профіль там 5 вакансій із 212, і жодної в Україні — усі з релокацією;
#   • їх API 27.07.2026 віддає HTTP 500 на будь-який запит. Сайт при цьому
#     живий, тобто зламалось у них, не в нас. Перевірити адаптер на живих
#     даних я не змогла.
# Увімкнути = поставити true. Впале джерело прогону не валить: інші три
# джерела відпрацюють, а помилка буде видна в підсумку.
[sources.andersen]
enabled = false
# Показується в боковому меню рядком із цією причиною. Порожньо — просто
# "вимкнений". Причина потрібна, щоб вимкнене джерело не читалось як забуте.
note = "API джерела не відповідає з 27.07.2026"

[[sources.andersen.feeds]]
specializations = "Design"

# ───────────────────────────────────────────────────────────────────────────
# Дошки з простим RSS. Новий майданчик = ще один блок [[...feeds]] нижче,
# без жодного рядка коду.
#
# 🔴 ЯК ПЕРЕВІРЯТИ ДОЗВІЛ, щоб не помилитись так, як помилились ми:
# НЕ використовуй `RobotFileParser.read()`. Він ходить по `urllib`, а
# weworkremotely і dribbble віддають `urllib` HTTP 403 — і парсер на 403
# мовчки вважає, що заборонено ВСЕ. Обидва сайти при цьому нам дозволяють.
# Забирай robots.txt тим самим клієнтом і UA, яким ходитимеш по даних, і
# лише тоді розбирай текст.
#
# `style` каже, як складено заголовок:
#   "company_colon" — «Компанія: Посада» (weworkremotely)
#   "is_hiring"     — «X is hiring for a position of Y in Z» (dribbble)
#   "plain"         — заголовок і є посадою (awwwards)
[sources.boards_rss]
enabled = true
# Густина дизайну висока, але не стовідсоткова: трапляються
# `Engineering Manager` і `Senior Creative Software Engineer`.
trust_category = false

[[sources.boards_rss.feeds]]
name  = "weworkremotely"
url   = "https://weworkremotely.com/categories/remote-design-jobs.rss"
style = "company_colon"

[[sources.boards_rss.feeds]]
name  = "dribbble"
url   = "https://dribbble.com/jobs.rss"
style = "is_hiring"

# ⚠️ awwwards: у їхньому robots.txt є `Disallow: /feed`, а наш шлях —
# `/jobs/feed/`. За буквою це різні шляхи (правило зіставляється з початку),
# тому формально дозволено. Але намір рядка може бути «фіди не чіпайте», а в
# нас правило тлумачити двозначність на користь власника сайту.
# Лишаю ввімкненим із цим написом на видноті: рішення має ухвалити людина.
# Якщо вирішиш, що намір ширший за букву — прибери цей блок, решта працює.
[[sources.boards_rss.feeds]]
name  = "awwwards"
url   = "https://www.awwwards.com/jobs/feed/"
style = "plain"

# ───────────────────────────────────────────────────────────────────────────
# jobico.io — українська IT-платформа. Єдине джерело, яке САМО кличе агентів.
#
# Їхній robots.txt починається коментарем:
#   # AI agents: no need to scrape HTML pages - machine-readable access is available.
#   # XML job feed: https://www.jobico.io/api/feeds/jobs.xml
# і `Allow: /api/feeds/` при загальному `Disallow: /api/`.
#
# 🔴 УМОВА ДОСТУПУ — АТРИБУЦІЯ. llms.txt: «always link to its original page
# on Jobico (the link field in the feed)». Тому посилання в картці — рівно
# те, що дав фід, разом із `utm_source=job-feed`. НЕ ЗРІЗАТИ: це не наш
# трекінг, а мітка джерела, якою воно рахує віддачу від агрегаторів.
#
# Налаштовувати нічого: фід один і спільний, вибірки за категоріями в ньому
# немає. Дизайну там 13 зі 190 — решту знімає наш фільтр.
[sources.jobico]
enabled = true
# Джерело саме не відбирає: у фіді Business Analyst, QA, розробники.
trust_category = false

# ───────────────────────────────────────────────────────────────────────────
# Recruitee — публічний API кар'єрних сторінок. КЛАС джерел, не один сайт:
# кожна компанія на цій ATS відкривається тим самим адаптером.
#
# robots.txt тенанта закриває лише /v/ (і то синтаксично зламаним записом —
# порожній рядок після User-Agent обриває групу). Нам потрібен /api/offers/,
# він відкритий. Ключа й авторизації не треба.
#
# 🔴 ДОДАВАТИ ЛИШЕ ПЕРЕВІРЕНІ СЛАГИ. Неіснуючий піддомен віддає помилку, і
# рядок у меню вічно показуватиме збій. Перевірка — один запит:
#     https://<слаг>.recruitee.com/api/offers/   →   має бути HTTP 200
#
# ⚠️ І ОДРАЗУ ДРУГА ПЕРЕВІРКА, без якої перша брехлива: відкрий будь-який
# `careers_url` з відповіді. Компанія може лишити API живим, вимкнувши
# хостинг кар'єрного сайту — тоді посилання веде на рекламну сторінку самої
# Recruitee. Так сталося з MacPaw: вакансії справжні, а відкрити їх за
# нашим посиланням неможливо. Адаптер це ловить сам і компанію пропускає,
# але краще не додавати таку взагалі.
[sources.recruitee]
enabled = true
# Джерело саме не відбирає за фахом: у видачі PR, податки, AI Research.
# Ключові слова потрібні — те саме, що з dou_companies.
trust_category = false
# Раз на добу. Цінність кар'єрних сторінок у ГЛИБИНІ, а не у свіжості:
# у Clario висить вакансія від 27.08.2025, тобто фід тримає майже рік.
every_hours = 24
companies = [
  "clario",
  # macpaw — НЕ додавати: API віддає 19 вакансій, але careers_url ведуть
  # на рекламну сторінку recruitee.com, а не на вакансію. Кар'єрний сайт
  # MacPaw переїхав, Recruitee лишився тільки бекендом. Перевірено 26.08.2026.
]

# ───────────────────────────────────────────────────────────────────────────
# work.ua — цільові списки, розбір HTML (фіда в них немає).
#
# ЧОМУ МОЖНА, і чому це не той випадок, що HappyMonday.
# Заміряно 14.08.2026 через robotparser на їхньому robots.txt:
#
#     UA                  /jobs-ux+ui+designer/     crawl-delay
#     find_new-jobfeed    дозволено (група `*`)     не задано
#     *                   дозволено                 не задано
#     ClaudeBot           дозволено                 2
#
# Правила Disallow у групах `*` і `ClaudeBot` ЗБІГАЮТЬСЯ повністю. Тобто нам
# відкрито те саме, що й іменованому боту, і назватись ClaudeBot заради
# доступу не тільки нечесно, а й безглуздо — воно нічого не додає.
# Затримку 2 с дотримуємо попри те, що для `*` її не задано: з двох правил
# беремо суворіше.
#
# 🔴 ЗАПИТИ ТІЛЬКИ ЦІЛЬОВІ. Широкий `дизайнер` не додавати: заміряно —
# він тягне меблі, одяг і пакування. Кожен рядок нижче перевірений окремо.
#
# ⚠️ Одруківка в запиті НЕ дає порожнечі: work.ua віддає 200 OK і десяток
# ЧУЖИХ вакансій (перевірено на нісенітниці — прийшли доценти й паркувальник).
# Адаптер розпізнає таку сторінку за класом `ga-search-no-results` і викидає
# її картки, але сам запит краще перевірити руками перед тим, як додавати.
[sources.work_ua]
# 🔴 ВИМКНЕНО 17.08.2026 — не тому, що зламався адаптер, і не тому, що нам
# заборонено правилами. Заборонив ЗАХИСТ сайту, а не його robots.txt.
#
# Хронологія, як вона є:
#   14.08  robots.txt перевірено — /jobs* дозволено і групі `*`, і ClaudeBot.
#          Адаптер написано, прогін по трьох запитах пройшов чисто:
#          52 вакансії, 200 OK, жодного 403, затримка 2 с дотримана.
#          53 записи лягли в базу звичайним щогодинним прогоном.
#   17.08  три запити з трьох віддали HTTP 403 із Cloudflare:
#          «Перевірка надійності підключення… Enable JavaScript and cookies».
#   09.09  🔴 ПЕРЕМІРЯНО, і попереднє формулювання виявилось неточним.
#          Дослідник зробив 9 запитів (по 3 на адресу, пауза 2.5 с):
#              /jobs-ux+ui+designer/     403, 200, 403
#              /jobs-graphic+designer/   403, 403, 200
#              /jobs-motion+designer/    403, 403, 403
#              robots.txt                200 щоразу
#          Той самий URL віддає то відмову, то 328 КБ даних.
#
# 🔴 Тобто перевірка ІМОВІРНІСНА, а не глуха стіна. І це гірше, а не краще.
#
# «Зачинено» — чесний стан: джерело мертве, адаптер віддає нуль, це видно.
# «Пропускає через раз» — джерело віддає ЧАСТИНУ даних і мовчить про решту:
# дві третини вакансій просто не з'являться, лічильники будуть здорові, і
# жоден наш сигнал цього не покаже. Рівно той клас поломки, який ми ловимо
# весь проєкт.
#
# Захист від цього в адаптері вже є: будь-який невдалий запит ставить
# `fetch_complete = False`, тобто сигнал «вакансія зникла» на такому прогоні
# гасне й неповнота не зараховується за зняття вакансій. Але самі КАРТКИ з
# успішних запитів усе одно прийшли б, і власник не мав би як дізнатись,
# що бачить третину.
#
# Проходити перевірку ми не будемо — це обхід бот-захисту, а не
# наполегливість. Дев'ять запитів дослідника — це ЗАМІР частки успіху, а не
